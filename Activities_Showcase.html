const nav=document.getElementById('nav');const groups=[['TFA','Formative activities'],['TSA','Summative activities'],['FINAL','Final project']];let current=0;
function render(){const a=activities[current],next=activities[(current+1)%activities.length],prev=activities[(current-1+activities.length)%activities.length];document.title=a.id+' · '+a.title;document.getElementById('track').textContent=a.track;document.getElementById('step').textContent=(current+1)+' / '+activities.length;document.getElementById('title').textContent=a.title;document.getElementById('description').textContent=a.desc;document.getElementById('trackChip').textContent=a.id+' · '+a.track;document.getElementById('count').textContent=(current+1)+' of '+activities.length;document.getElementById('appName').textContent=a.app;document.getElementById('screenTitle').textContent=a.screen;document.getElementById('screenSubtitle').textContent=a.sub;document.getElementById('sampleAction').textContent=a.action;document.getElementById('tableTitle').textContent=a.table;document.getElementById('tableCount').textContent='Showing '+a.rows.length+' samples';document.getElementById('screenFoot').textContent=a.foot;document.getElementById('nextTitle').textContent='Up next: '+next.id+' · '+next.title;document.getElementById('nextDescription').textContent=next.desc;document.getElementById('nextLabel').textContent='Continue to '+next.id;document.getElementById('chips').innerHTML=a.chips.map(x=>'<span class="chip">'+x+'</span>').join('');document.getElementById('appNav').innerHTML=a.nav.map((x,i)=>'<div class="appnav '+(i===0?'selected':'')+'">'+x+'</div>').join('');document.getElementById('stats').innerHTML=a.stats.map(x=>'<div class="stat"><div class="statlabel">'+x[0]+'</div><div class="statvalue">'+x[1]+'</div><div class="statnote">'+x[2]+'</div></div>').join('');document.getElementById('thead').innerHTML='<tr>'+a.cols.map(x=>'<th>'+x+'</th>').join('')+'</tr>';document.getElementById('tbody').innerHTML=a.rows.map((row,r)=>'<tr>'+row.map((x,c)=>'<td>'+(c===row.length-1?'<span class="pill '+(String(x).match(/Pending|Low|In progress|Redirect/)?'warn':String(x).match(/Completed|Active|Available|Valid|Ready|Secure|Saved/)?'':'blue')+'">'+x+'</span>':x)+'</td>').join('')+'</tr>').join('');nav.querySelectorAll('.navitem').forEach((n,i)=>n.classList.toggle('on',i===current));document.getElementById('prevTop').textContent='← '+prev.id;document.getElementById('nextTop').textContent=next.id+' →';history.replaceState(null,'','#'+a.id)}
function go(delta){current=(current+delta+activities.length)%activities.length;render();window.scrollTo({top:0,behavior:'smooth'})}
activities.forEach((a,i)=>{if(a.id==='TFA1'||a.id==='TSA1'||a.id==='FINAL'){const group=document.createElement('div');group.className='navgroup';group.textContent=a.id==='TFA1'?groups[0][1]:a.id==='TSA1'?groups[1][1]:groups[2][1];nav.appendChild(group)}const b=document.createElement('button');b.type='button';b.className='navitem';b.innerHTML='<span class="navnum">'+a.id+'</span><span>'+a.title+'</span>';b.addEventListener('click',()=>{current=i;render()});nav.appendChild(b)});
